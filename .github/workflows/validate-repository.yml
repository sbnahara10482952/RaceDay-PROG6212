name: Validate Repository

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate repository folders
        run: |
          test -d docs
          test -d .github/workflows
          echo "Required repository folders exist"

      - name: Validate documentation files
        run: |
          test -f docs/RaceDay_API_Endpoint_Plan.pdf
          test -f docs/RaceDay_Database.sql
          test -f docs/RaceDay_ERD.png
          test -f docs/RaceDay_ERD.drawio
          test -f docs/SQL_Screenshots.pdf
          echo "All required documentation files exist"

      - name: Validate README
        run: |
          test -f README.md
          test -s README.md
          echo "README exists and contains content"

      - name: Validate gitignore
        run: |
          test -f .gitignore
          echo ".gitignore exists"
